spring:
  application:
    name: spring-authorization-server


  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER_NAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
server:
  port: 9000

auth:
  keystore:
    path: secrets/auth-signing-key.p12